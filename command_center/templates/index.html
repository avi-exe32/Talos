<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Talos Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #111;
            --text-color: #00ff00; /* Neon Green default */
            --warning-color: #ffaa00; /* Neon Amber */
            --error-color: #ff0000; /* Neon Red */
            --border-glow: 0 0 10px rgba(0, 255, 0, 0.5);
            --border-glow-amber: 0 0 15px rgba(255, 170, 0, 0.8);
            --border-glow-red: 0 0 15px rgba(255, 0, 0, 0.8);
        }
        body {
            background-color: var(--bg-color);
            color: #ddd;
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            color: #fff;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex: 1;
            overflow: hidden;
        }
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid #333;
            border-radius: 5px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }
        .panel-title {
            font-size: 1.2rem;
            margin-top: 0;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            color: #aaa;
            text-transform: uppercase;
        }
        /* Live Stream Section */
        #stream-container {
            border: 1px solid #00ff00;
            box-shadow: var(--border-glow);
            padding: 15px;
            flex: 1;
            overflow: auto;
            background: #000;
            color: var(--text-color);
            font-size: 0.9rem;
            white-space: pre-wrap;
            transition: all 0.3s ease;
        }
        .status-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 5px 15px;
            border-radius: 3px;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .status-nominal {
            border: 1px solid #00ff00;
            color: #00ff00;
            box-shadow: 0 0 10px rgba(0,255,0,0.5);
        }
        .status-warning {
            border: 1px solid #ffaa00;
            color: #ffaa00;
            box-shadow: 0 0 10px rgba(255,170,0,0.5);
        }
        .status-escalated {
            border: 1px solid #ff0000;
            color: #ff0000;
            box-shadow: 0 0 10px rgba(255,0,0,0.8);
        }
        
        /* Terminal Log Section */
        #terminal-log {
            flex: 1;
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 15px;
            overflow-y: auto;
            font-size: 0.9rem;
        }
        .log-entry {
            margin-bottom: 12px;
            line-height: 1.4;
            border-left: 2px solid #444;
            padding-left: 10px;
        }
        .log-time { color: #888; }
        .log-agent { color: #00aaff; font-weight: bold; }
        .log-state-pending { color: #ffaa00; font-weight: bold; }
        .log-state-executed { color: #00ff00; font-weight: bold; }
        .log-state-rejected { color: #ff0000; font-weight: bold; }
        .log-payload { color: #aaa; margin-top: 4px; display: block; font-size: 0.85rem;}
        
        /* State override classes */
        .glow-amber {
            border-color: var(--warning-color) !important;
            box-shadow: var(--border-glow-amber) !important;
            color: var(--warning-color) !important;
        }
        .glow-red {
            border-color: var(--error-color) !important;
            box-shadow: var(--border-glow-red) !important;
            color: var(--error-color) !important;
        }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center; padding-right: 20px;">
        <h1>TALOS_COMMAND_CENTER</h1>
        <button id="reset-demo-btn" style="padding: 8px 15px; font-family: 'JetBrains Mono', monospace; background: transparent; border: 1px solid #666; color: #666; cursor: pointer; border-radius: 3px; transition: 0.3s; height: 40px;" onmouseover="this.style.color='#fff'; this.style.borderColor='#fff'" onmouseout="this.style.color='#666'; this.style.borderColor='#666'">RESET DEMO</button>
    </div>
    
    <div class="dashboard">
        <!-- LEFT: Live Vendor Stream -->
        <div class="panel">
            <h2 class="panel-title">Live Vendor Stream</h2>
            <div id="status-badge" class="status-indicator status-nominal">NOMINAL</div>
            <p style="color: #666; font-size: 0.85rem; margin: 10px 0;">TARGET_URL: <span id="target-url" style="color: #00aaff;">Loading...</span></p>
            <div id="stream-container">
Initializing uplink...
            </div>
        </div>

        <!-- RIGHT: Agent Audit Log -->
        <div class="panel">
            <h2 class="panel-title">Agent Audit Log</h2>
            <button id="approve-btn" style="display: none; padding: 15px; font-size: 1.2rem; font-weight: bold; font-family: 'JetBrains Mono', monospace; cursor: pointer; background: #222; color: #ffaa00; border: 2px solid #ffaa00; box-shadow: 0 0 15px rgba(255, 170, 0, 0.8); border-radius: 5px; margin-bottom: 15px; text-transform: uppercase; transition: all 0.3s ease;">⚡ AUTHORIZE MITIGATION ⚡</button>
            <div id="terminal-log">
                <div style="color: #666;">> Awaiting audit logs...</div>
            </div>
        </div>
    </div>

    <script>
        async function fetchState() {
            try {
                const response = await fetch('/api/system_state');
                const data = await response.json();
                
                // Update Target URL
                document.getElementById('target-url').textContent = data.current_url || "Unknown";

                // Update Status Badge and Container Glow
                const badge = document.getElementById('status-badge');
                const container = document.getElementById('stream-container');
                
                if (data.scout_status === "NOMINAL") {
                    badge.className = "status-indicator status-nominal";
                    badge.textContent = "NOMINAL";
                    container.classList.remove('glow-amber', 'glow-red');
                } else if (data.scout_status === "WARNING") {
                    badge.className = "status-indicator status-warning";
                    badge.textContent = `WARNING (${data.consecutive_failures}/3)`;
                    container.classList.add('glow-amber');
                    container.classList.remove('glow-red');
                } else {
                    badge.className = "status-indicator status-escalated";
                    badge.textContent = "ESCALATED";
                    container.classList.remove('glow-amber');
                    container.classList.add('glow-red');
                }

                // Update JSON Payload stream
                if (data.last_payload) {
                    container.textContent = JSON.stringify(data.last_payload, null, 2);
                }

                // Update Terminal Log
                const terminal = document.getElementById('terminal-log');
                if (data.agent_logs && data.agent_logs.length > 0) {
                    // Check if scrolled to bottom before update to allow auto-scrolling
                    const isScrolledToBottom = terminal.scrollHeight - terminal.clientHeight <= terminal.scrollTop + 5;
                    
                    let logHtml = '';
                    data.agent_logs.forEach(log => {
                        let stateClass = '';
                        if(log.state === 'Pending') stateClass = 'log-state-pending';
                        if(log.state === 'Executed') stateClass = 'log-state-executed';
                        if(log.state === 'Rejected') stateClass = 'log-state-rejected';
                        
                        logHtml += `<div class="log-entry">
                            <span class="log-time">[${log.time}]</span> 
                            <span class="log-agent">${log.agent}</span> :: 
                            <span class="${stateClass}">${log.state}</span>
                            <span class="log-payload">${JSON.stringify(log.payload)}</span>
                        </div>`;
                    });
                    
                    // Only update DOM if content changed to prevent cursor jumps or flickering
                    if (terminal.innerHTML !== logHtml) {
                        terminal.innerHTML = logHtml;
                        if (isScrolledToBottom) {
                            terminal.scrollTop = terminal.scrollHeight;
                        }
                    }
                } else {
                    if (terminal.innerHTML !== '<div style="color: #666;">> Awaiting audit logs...</div>') {
                        terminal.innerHTML = '<div style="color: #666;">> Awaiting audit logs...</div>';
                    }
                }

                // Show or hide Approval button
                const btn = document.getElementById('approve-btn');
                if (data.has_pending) {
                    btn.style.display = 'block';
                } else {
                    btn.style.display = 'none';
                }
            } catch (err) {
                console.error("Failed to fetch system state:", err);
            }
        }

        // Approval button click handler
        document.getElementById('approve-btn').addEventListener('click', async () => {
            const btn = document.getElementById('approve-btn');
            btn.textContent = "EXECUTING...";
            btn.style.opacity = "0.5";
            btn.style.pointerEvents = "none";
            try {
                await fetch('/api/approve_mitigation', { method: 'POST' });
                // Hide button immediately to feel snappy
                btn.style.display = 'none';
            } catch (err) {
                console.error("Failed to approve mitigation:", err);
            } finally {
                btn.textContent = "⚡ AUTHORIZE MITIGATION ⚡";
                btn.style.opacity = "1";
                btn.style.pointerEvents = "auto";
            }
        });

        // Reset Demo button click handler
        document.getElementById('reset-demo-btn').addEventListener('click', async () => {
            if (confirm("Reset demo? This will wipe the agent log and revert to the primary vendor stream.")) {
                try {
                    await fetch('/api/reset_demo', { method: 'POST' });
                    document.getElementById('terminal-log').innerHTML = '<div style="color: #666;">> System reset. Awaiting audit logs...</div>';
                } catch (err) {
                    console.error("Failed to reset demo:", err);
                }
            }
        });

        // Run every 1000ms
        setInterval(fetchState, 1000);
        fetchState();
    </script>
</body>
</html>
